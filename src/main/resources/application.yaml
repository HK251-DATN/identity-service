# LOCAL MACHINE
spring:
  application:
    name: identity_service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/identity_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}


