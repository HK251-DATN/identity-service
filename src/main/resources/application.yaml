# LOCAL MACHINE
spring:
  application:
    name: identity_service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/identity_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mvc:
    log-request-details: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  kafka-url: ${KAFKA_HOST}:${KAFKA_PORT}

cloudflare:
  r2:
    endpoint: https://499bb5ccc0de718e6ef985931d71a03a.r2.cloudflarestorage.com
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket: back-office-user-avts
    region: auto

server:
  port: 9000
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    readinessstate:
      enabled: true

services:
  back-office:
    url: http://${BACK_OFFICE_HOST:localhost}:${BACK_OFFICE_PORT:9100}
  product-storage:
    url: http://${PRODUCT_STORAGE_HOST:localhost}:${PRODUCT_STORAGE_PORT:9200}
  ecommerce:
    url: http://${ECOMMERCE_HOST:localhost}:${ECOMMERCE_PORT:9300}

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    web: DEBUG